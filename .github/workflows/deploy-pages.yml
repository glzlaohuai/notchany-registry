# 部署市场静态站到 GitHub Pages。
# 网站只消费已经提交的发布索引，不从候选包重建。
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # build-index 从 git 历史取 published_at/updated_at
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建静态站
        run: node scripts/build-site.mjs
        env:
          NOTCHANY_COUNTS_URL: ${{ vars.NOTCHANY_COUNTS_URL }}
          NOTCHANY_APP_DOWNLOAD_URL: ${{ vars.NOTCHANY_APP_DOWNLOAD_URL }}
          NOTCHANY_MARKET_API_BASE: ${{ vars.MARKET_API_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
