name: 发布 index

on:
  push:
    branches: [main]
    paths:
      - "packages/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成 index
        run: node scripts/build-index.mjs

      - name: 提交 index（有变化时）
        run: |
          if git diff --quiet -- index/v1/index.json; then
            echo "index 无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/v1/index.json
          git commit -m "chore: 重新生成 index [skip ci]"
          git push
