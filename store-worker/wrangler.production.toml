# 生产 Store：公开内容由 Static Assets 交付，Account/Auth 只经 Commercial binding。
name = "notchany-store"
main = "worker.js"
compatibility_date = "2026-09-16"
workers_dev = false

routes = [
  { pattern = "notchany.com", custom_domain = true },
]

[[services]]
binding = "COMMERCIAL"
service = "notchany-commercial"

[assets]
directory = "../site/dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = [
  "/account",
  "/account/*",
  "/auth/*",
  "/v1",
  "/v1/*",
  "/health",
  "/internal",
  "/internal/*",
]
